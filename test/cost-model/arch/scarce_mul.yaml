architecture:
  name: "NeuraScarceMul"
  version: "1.0"

# 4x4 single CGRA. Every tile has all FUs (incl. mem so memory is never the
# bottleneck) EXCEPT integer 'mul', which exists on tile (0,0) ONLY. A kernel
# with K independent multiplies therefore has ResMII(mul) = ceil(K/1) = K: the
# mapper must serialise all K muls onto one tile, so oracle II >= K. This
# isolates the per-FU-class ResMII refinement (the crude ceil(#ops/#tiles)
# baseline would predict ~K/16 and badly under-predict).
multi_cgra_defaults:
  base_topology: "mesh"
  rows: 1
  columns: 1

per_cgra_defaults:
  rows: 4
  columns: 4
  ctrl_mem_items: 64
  base_topology: "mesh"

tile_defaults:
  num_registers: 64
  fu_types: ["add", "div", "fadd", "fmul", "fdiv", "logic", "cmp", "sel", "type_conv", "grant", "loop_control", "phi", "constant", "return", "alloca", "shift", "mem", "mem_indexed"]

link_defaults:
  latency: 1
  bandwidth: 32

link_overrides:

tile_overrides:
  # Only this tile provides integer 'mul'.
  - cgra_x: 0
    cgra_y: 0
    tile_x: 0
    tile_y: 0
    fu_types: ["add", "mul", "div", "fadd", "fmul", "fdiv", "logic", "cmp", "sel", "type_conv", "grant", "loop_control", "phi", "constant", "return", "alloca", "shift", "mem", "mem_indexed"]
    num_registers: 64
    existence: true

extensions:
  crossbar: false

simulator:
  execution_model: "serial"
  logging:
    enabled: true
    file: "output.log"
  driver:
    name: "Driver"
    frequency: "1GHz"
  device:
    name: "Device"
    frequency: "1GHz"
    bind_to_architecture: true
